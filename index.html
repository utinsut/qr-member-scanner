<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b1220">
  <title>สแกนบัตรสมาชิก</title>
  <script src="https://unpkg.com/@zxing/browser@0.2.1"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;background:#0b1220;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}
    .wrap{max-width:720px;margin:0 auto;padding:18px 14px 34px}
    h1{font-size:25px;text-align:center;margin:8px 0 4px}
    .sub{text-align:center;color:#cbd5e1;margin-bottom:14px;font-size:14px}
    .camera{position:relative;width:100%;min-height:320px;border-radius:20px;overflow:hidden;background:#111827;box-shadow:0 10px 30px rgba(0,0,0,.25)}
    video{display:block;width:100%;height:58vh;min-height:320px;max-height:620px;object-fit:cover;background:#111827}
    .guide{position:absolute;left:7%;right:7%;top:50%;height:180px;transform:translateY(-50%);border:3px solid rgba(255,255,255,.92);border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.12);pointer-events:none}
    .guide:before,.guide:after{content:"";position:absolute;left:8%;right:8%;height:2px;background:#22c55e;box-shadow:0 0 12px #22c55e}
    .guide:before{top:38%}.guide:after{top:62%;opacity:.45}
    .status{margin-top:14px;padding:13px 14px;border-radius:13px;background:#173022;color:#d7ffe2;line-height:1.55;font-size:15px}
    .status.error{background:#3b161b;color:#ffd7da}.status.ok{background:#12391f;color:#dcffe5}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    button{border:0;border-radius:12px;min-height:50px;font-size:16px;font-weight:700;padding:10px 12px}
    .primary{background:#0d6efd;color:#fff}.secondary{background:#334155;color:#fff}
    .manual{margin-top:14px;display:flex;gap:8px}
    .manual input{flex:1;min-width:0;min-height:50px;border:1px solid #475569;border-radius:12px;background:#fff;color:#111827;font-size:18px;padding:10px 12px;text-transform:uppercase}
    .manual button{background:#16a34a;color:#fff;min-width:95px}
    .hint{margin-top:12px;color:#94a3b8;font-size:13px;line-height:1.55}
    @media(max-width:520px){.wrap{padding:12px 10px 26px}h1{font-size:23px}.camera{min-height:290px}video{height:56vh;min-height:290px}.guide{height:150px}.buttons{grid-template-columns:1fr}.manual{flex-direction:column}.manual button{width:100%}}
  </style>
</head>
<body>
<div class="wrap">
  <h1>สแกนบัตรสมาชิก</h1>
  <div class="sub">รองรับทั้ง QR Code และบาร์โค้ด 1 มิติบนบัตรสมาชิก</div>

  <div class="camera">
    <video id="video" playsinline muted></video>
    <div class="guide"></div>
  </div>

  <div id="status" class="status">กำลังเตรียมกล้อง…</div>

  <div class="buttons">
    <button class="primary" type="button" onclick="startScanner()">📷 เปิด/เริ่มกล้องใหม่</button>
    <button class="secondary" type="button" onclick="stopScanner()">⏹ หยุดกล้อง</button>
  </div>

  <div class="manual">
    <input id="manualCode" inputmode="text" autocomplete="off" placeholder="กรอกรหัส เช่น OY001 / LT001">
    <button type="button" onclick="submitManual()">ค้นหา</button>
  </div>

  <div class="hint">เวลาสแกนบาร์โค้ด ให้ถือกล้องนิ่งและให้แท่งบาร์โค้ดอยู่ภายในกรอบแนวนอน ถ้าบาร์โค้ดอยู่บนหน้าจอคอมพิวเตอร์ ให้เพิ่มความสว่างหน้าจอและหลีกเลี่ยงแสงสะท้อน</div>
</div>

<script>
  const DEFAULT_RETURN_URL = 'https://script.google.com/macros/s/AKfycbz7RSY7EL15Ujk_NVj24ParzaACeG4mjN9GTNe0FTT1GT91e6Dp05WzYRdotykzZoLf9g/exec';
  const params = new URLSearchParams(location.search);
  const RETURN_URL = (params.get('return') || DEFAULT_RETURN_URL).trim();

  let reader = null;
  let controls = null;
  let busy = false;
  let started = false;

  function setStatus(text, type='') {
    const el = document.getElementById('status');
    el.textContent = text;
    el.className = 'status' + (type ? ' ' + type : '');
  }

  function normalizeCandidate(raw) {
    let text = String(raw || '').trim();
    if (!text) return '';

    // กรณี QR เป็น URL ที่มี ?member=...
    try {
      const url = new URL(text);
      const m = url.searchParams.get('member');
      if (m) text = m;
    } catch(e) {}

    try { text = decodeURIComponent(text); } catch(e) {}
    text = text.toUpperCase().trim();

    const paramMatch = text.match(/(?:^|[?&\s])MEMBER\s*=\s*([^&#\s]+)/i);
    if (paramMatch && paramMatch[1]) text = paramMatch[1];

    // รองรับรหัสที่ใช้อยู่/เคยใช้ เช่น LT001, OY001, NKC001
    const codeMatch = text.match(/(?:LT|OY|NKC)\s*[-_.\/]?\s*0*\d+/i);
    if (codeMatch) return codeMatch[0].replace(/[\s\-_.\/]/g, '').toUpperCase();

    // ถ้า Barcode เข้ารหัสข้อความอื่น ให้ส่งค่าที่อ่านได้ตรง ๆ ไปให้ Apps Script ตรวจสอบ
    return text.replace(/\s+/g, '');
  }

  function goToMember(raw) {
    if (busy) return;
    const code = normalizeCandidate(raw);
    if (!code) return;

    busy = true;
    setStatus('อ่านรหัสได้: ' + code + ' — กำลังเปิดแบบฟอร์ม…', 'ok');
    try { if (controls) controls.stop(); } catch(e) {}

    const sep = RETURN_URL.includes('?') ? '&' : '?';
    setTimeout(() => {
      window.location.href = RETURN_URL + sep + 'member=' + encodeURIComponent(code);
    }, 350);
  }

  async function startScanner() {
    if (started && controls) return;
    busy = false;
    setStatus('กำลังเปิดกล้องหลัง…');

    if (!window.ZXingBrowser) {
      setStatus('โหลดตัวอ่านบาร์โค้ดไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้า', 'error');
      return;
    }

    try {
      reader = new ZXingBrowser.BrowserMultiFormatReader(undefined, {
        delayBetweenScanAttempts: 120,
        delayBetweenScanSuccess: 700
      });

      const video = document.getElementById('video');
      controls = await reader.decodeFromVideoDevice(undefined, video, (result, error, ctl) => {
        if (result && !busy) {
          const raw = typeof result.getText === 'function' ? result.getText() : (result.text || String(result));
          goToMember(raw);
        }
      });

      started = true;
      setStatus('พร้อมสแกน — เล็งไปที่ QR Code หรือบาร์โค้ดบนบัตร', 'ok');
    } catch (err) {
      started = false;
      controls = null;
      let msg = err && err.message ? err.message : String(err || 'ไม่ทราบสาเหตุ');
      setStatus('เปิดกล้องไม่สำเร็จ: ' + msg, 'error');
    }
  }

  function stopScanner() {
    try { if (controls) controls.stop(); } catch(e) {}
    controls = null;
    started = false;
    const video = document.getElementById('video');
    try {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
        video.srcObject = null;
      }
    } catch(e) {}
    setStatus('หยุดกล้องแล้ว');
  }

  function submitManual() {
    const v = document.getElementById('manualCode').value;
    if (!String(v || '').trim()) {
      setStatus('กรุณากรอกรหัสสมาชิกก่อน', 'error');
      return;
    }
    goToMember(v);
  }

  document.getElementById('manualCode').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitManual();
  });

  window.addEventListener('load', () => {
    setTimeout(startScanner, 300);
  });
  window.addEventListener('pagehide', stopScanner);
</script>
</body>
</html>
